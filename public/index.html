<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parrot Status</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap");

    :root {
      --ink: #f2f2f2;
      --muted: #a0a0a0;
      --line: #3a3a3a;
      --panel: #222;
      --canvas: #171717;
      --green: #648a3d;
      --amber: #b5a45f;
      --red: #8d3431;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Space Grotesk", system-ui, sans-serif;
    }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 36px; }
    .brand { display: flex; align-items: center; }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 4vw, 3.6rem); letter-spacing: -.07em; line-height: .95; }
    .subhead { margin: 10px 0 0; color: var(--muted); font-size: .9rem; }
    .refresh { color: var(--muted); font: 12px "DM Mono", monospace; text-align: right; }
    .refresh strong { display: block; color: #fff; font-weight: 400; margin-top: 6px; }
    .overall { color: #fff; font-size: 1.1rem; margin: 0 0 28px; }
    .overall.offline { color: var(--red); }
    .notices { display: grid; gap: 8px; margin: -14px 0 28px; }
    .notice { border-left: 2px solid #888; background: #222; padding: 11px 14px; color: #ddd; }
    .notice strong { color: #fff; }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 19px; }
    h2 { margin: 0; font-size: 1.05rem; letter-spacing: -.02em; }
    .range { color: var(--muted); font: 11px "DM Mono", monospace; }
    .chart { position: relative; height: 230px; }
    .grid { position: absolute; inset: 0 0 22px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .grid div { border-top: 1px solid #333; position: relative; }
    .grid span { position: absolute; right: calc(100% + 10px); top: -8px; color: var(--muted); font: 10px "DM Mono", monospace; }
    svg { position: absolute; inset: 0 0 22px; width: 100%; height: calc(100% - 22px); overflow: visible; }
    .axis { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; color: var(--muted); font: 10px "DM Mono", monospace; }
    .servers { display: grid; gap: 9px; }
    .server-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px 24px; background: var(--panel); border-left: 2px solid var(--line); padding: 18px 20px 15px; }
    .server-name { color: #fff; font-size: 1rem; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px "DM Mono", monospace; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6f7775; }
    .offline .dot { background: #6f7775; }
    .uptime { font: 500 1.15rem "DM Mono", monospace; text-align: right; }
    .health-green .uptime { color: var(--green); }
    .health-yellow .uptime { color: var(--amber); }
    .health-red .uptime { color: var(--red); }
    .server-chart { grid-column: 1 / -1; border-top: 1px solid #333; padding-top: 12px; }
    .day-strip { display: grid; grid-template-columns: repeat(60, minmax(5px, 1fr)); gap: 3px; height: 54px; align-items: end; }
    .day { position: relative; min-width: 0; height: 100%; background: #444; cursor: help; }
    .day::after { content: ""; position: absolute; inset: auto 0 0; height: var(--uptime); background: var(--green); }
    .day.partial::after { background: var(--amber); }
    .day.low::after { background: var(--red); }
    .day.empty::after { height: 0; }
    .day:hover { outline: 1px solid var(--ink); z-index: 1; }
    .day:hover::before { content: attr(data-detail); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 190px; padding: 7px 9px; color: var(--ink); background: #292929; border: 1px solid var(--line); font: 10px/1.45 "DM Mono", monospace; text-align: center; z-index: 2; }
    .day-axis { display: flex; justify-content: space-between; color: var(--muted); font: 10px "DM Mono", monospace; margin-top: 8px; }
    .empty, .error { color: var(--muted); padding: 30px 0; }
    @media (max-width: 700px) {
      main { width: min(100% - 26px, 560px); padding-top: 26px; }
      header { align-items: flex-start; flex-direction: column; padding-bottom: 26px; }
      .refresh { text-align: left; }
      .server-row { gap: 12px; padding: 15px; }
      .server-row .status { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="brand"><h1>Parrot Status</h1></div>
        <p class="subhead">Server uptime</p>
      </div>
      <div class="refresh">LIVE MONITOR<strong id="updated">Connecting…</strong></div>
    </header>
    <p class="overall" id="overall">Checking server status…</p>
    <div class="notices" id="notices"></div>
    <section>
      <div class="panel-head"><h2>Servers</h2></div>
      <div class="servers" id="servers"><p class="empty">Loading…</p></div>
    </section>
  </main>
  <script>
    const api = window.location.origin;
    const $ = (id) => document.getElementById(id);
    const formatPct = (value) => value == null ? "—" : `${Number(value).toFixed(2)}%`;
    async function fetchJson(path) {
      const response = await fetch(`${api}${path}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }
    function formatDuration(milliseconds) {
      const minutes = Math.max(0, Math.round(milliseconds / 60000));
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;
      return `${hours}h ${remainingMinutes}m`;
    }
    function drawGraph(days, name) {
      if (!days.length) return "";
      const safeName = escapeHtml(name);
      const now = Date.now();
      const cells = days.map((day) => {
        const start = Date.parse(`${day.day}T00:00:00Z`);
        const end = Math.min(start + 86400000, now);
        const duration = Math.max(0, end - start);
        const uptime = day.uptime == null ? null : Math.max(0, Math.min(100, Number(day.uptime)));
        const downtime = uptime == null ? null : duration * (100 - uptime) / 100;
        const detail = uptime == null
          ? `${day.day} · no data`
          : `${day.day} · ${uptime.toFixed(2)}% up · ${formatDuration(downtime)} down`;
        const healthClass = uptime == null ? "empty" : uptime < 90 ? "low" : uptime < 98 ? "partial" : "";
        return `<div class="day ${healthClass}"
          style="--uptime:${uptime == null ? 0 : uptime}%"
          data-detail="${escapeHtml(detail)}"
          aria-label="${escapeHtml(detail)}"
          title="${escapeHtml(detail)}"></div>`;
      }).join("");
      return `<div class="server-chart" aria-label="${safeName} uptime over the last 60 days">
        <div class="day-strip">${cells}</div>
        <div class="day-axis"><span>${days[0].day}</span><span>30 days</span><span>Today</span></div>
      </div>`;
    }
    function renderServers(servers, uptimeById) {
      $("servers").innerHTML = servers.length ? servers.map(server => {
        const days = uptimeById[server.id] || [];
        const current = days.at(-1)?.uptime;
        const healthClass = current == null ? "" : current < 90 ? "health-red" : current < 98 ? "health-yellow" : "health-green";
        return `<article class="server-row ${server.status} ${healthClass}">
          <div><div class="server-name">${escapeHtml(server.title || server.name)}</div></div>
          <div class="uptime">${formatPct(current)}</div>
          <div class="status"><span class="dot"></span>${server.status}</div>
          ${drawGraph(days, server.title || server.name)}
        </article>`;
      }).join("") : '<p class="empty">No servers.</p>';
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[char]));
    }
    async function refresh() {
      try {
        const servers = await fetchJson("/servers");
        const [incidents, maintenance] = await Promise.all([
          fetchJson("/incidents"),
          fetchJson("/maintenance")
        ]);
        const names = Object.fromEntries(servers.map(server => [server.id, server.title || server.name]));
        $("notices").innerHTML = [
          ...maintenance.map(item => `<div class="notice"><strong>Maintenance:</strong> ${escapeHtml(item.title)}${names[item.server_id] ? ` · ${escapeHtml(names[item.server_id])}` : ""}</div>`),
          ...incidents.map(item => `<div class="notice"><strong>Incident:</strong> ${escapeHtml(item.title)}</div>`)
        ].join("");
        const allOperational = servers.length > 0 && servers.every(server => server.status === "online");
        $("overall").textContent = allOperational ? "All servers operational" : servers.length ? "Some servers are offline" : "No servers configured";
        $("overall").className = `overall${allOperational || !servers.length ? "" : " offline"}`;
        const uptimeEntries = await Promise.all(servers.map(async server => [server.id, await fetchJson(`/servers/${server.id}/uptime`)]));
        const uptimeById = Object.fromEntries(uptimeEntries);
        renderServers(servers, uptimeById);
        $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
      } catch (error) {
        $("updated").textContent = "Connection lost";
        $("servers").innerHTML = `<p class="error">Unable to load server data.</p>`;
      }
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
