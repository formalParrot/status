<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parrot Status — Manage</title>
  <style>
    :root { color-scheme: dark; --bg:#171717; --panel:#222; --line:#3a3a3a; --text:#f2f2f2; --muted:#a0a0a0; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:15px system-ui,sans-serif }
    main { width:min(900px,calc(100% - 32px)); margin:0 auto; padding:40px 0 64px } header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px }
    h1,h2 { margin:0 } h1 { font-size:32px; letter-spacing:-.05em } h2 { font-size:18px; margin-bottom:16px }
    section { background:var(--panel); border:1px solid var(--line); padding:22px; margin-top:18px }
    input,textarea,select,button { width:100%; background:#181818; color:var(--text); border:1px solid #555; border-radius:8px; padding:10px; font:inherit }
    textarea { min-height:72px; resize:vertical } button { cursor:pointer; width:auto; background:#f2f2f2; color:#171717; border:0; border-radius:8px; padding:10px 15px; transition:transform .15s ease,opacity .15s ease }
    button:hover { opacity:.88; transform:translateY(-1px) } button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:2px solid #f2f2f2; outline-offset:2px }
    .secondary { background:#333; color:var(--text) } .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px } form { display:grid; gap:12px }
    .item { border-top:1px solid var(--line); padding:14px 0; display:flex; justify-content:space-between; gap:15px; align-items:start } .item small { display:block; color:var(--muted); margin-top:4px }
    .hidden { display:none } .message { color:var(--muted); margin:10px 0 } @media(max-width:600px){.grid{grid-template-columns:1fr} header{align-items:start;gap:15px;flex-direction:column}}
  </style>
</head>
<body><main>
  <header><h1>Manage status</h1><button id="logout" class="secondary hidden">Sign out</button></header>
  <section id="login"><h2>Admin PIN</h2><form id="login-form"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit PIN" required><button>Sign in</button></form><p class="message" id="login-message"></p></section>
  <div id="app" class="hidden">
    <section><h2>Servers</h2><div id="servers"></div><form id="server-form"><input id="server-title" placeholder="Server title" required><button>Create server</button></form></section>
    <section><h2>Maintenance</h2><form id="maintenance-form"><div class="grid"><select id="maintenance-server" required></select><input id="maintenance-title" placeholder="Maintenance title" required></div><button>Start maintenance now</button></form><div id="maintenance-list"></div></section>
    <section><h2>Incidents</h2><form id="incident-form"><div class="grid"><select id="incident-server"></select><input id="incident-title" placeholder="Incident title" required></div><textarea id="incident-description" placeholder="Description"></textarea><button>Publish incident</button></form><div id="incident-list"></div></section>
    <section><h2>Discord webhooks</h2><form id="webhook-form"><div class="grid"><input id="webhook-name" placeholder="Webhook name" required><select id="webhook-server"><option value="">All servers</option></select></div><input id="webhook-url" type="url" placeholder="https://discord.com/api/webhooks/..." required><button>Add webhook</button></form><div id="webhook-list"></div></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id), api="/admin/api";
async function request(path, options={}){const r=await fetch(api+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});if(!r.ok)throw new Error((await r.json()).error||"Request failed");return r.status===204?null:r.json()}
function item(text, action, label){return `<div class="item"><div>${text}</div>${action?`<button class="secondary" onclick="${action}">${label}</button>`:""}</div>`}
async function load(){const servers=await fetch("/servers").then(r=>r.json());$("servers").innerHTML=servers.map(s=>item(`${s.title||s.name}<small>${s.status}</small>`,`resetUptime(${s.id})`,"Reset uptime")+" "+`<button class="secondary" onclick="rename(${s.id})">Rename</button>`+` <button class="secondary" onclick="removeServer(${s.id})">Delete</button>`).join("")||"No servers";["maintenance-server","incident-server"].forEach(id=>$(id).innerHTML=servers.map(s=>`<option value="${s.id}">${s.title||s.name}</option>`).join("")); $("webhook-server").innerHTML='<option value="">All servers</option>'+servers.map(s=>`<option value="${s.id}">${s.title||s.name}</option>`).join(""); const incidents=await request("/incidents");$("incident-list").innerHTML=incidents.map(i=>item(`${i.title}<small>${i.status}</small>`,i.status==="open"?`resolve(${i.id})`:"","Resolve")).join("")||"No incidents";const hooks=await request("/webhooks");$("webhook-list").innerHTML=hooks.map(h=>item(`${h.name}<small>${h.server_id?"Server "+h.server_id:"All servers"}</small>`,`removeHook(${h.id})`,"Remove")).join("")||"No webhooks"; const maintenance=await Promise.all(servers.map(async s=>(await request(`/maintenance/${s.id}`)).map(m=>({...m,server:s.title||s.name}))));$("maintenance-list").innerHTML=maintenance.flat().map(m=>item(`${m.title}<small>${m.server} · ${m.ends_at?"Ended":"Active"}</small>`,m.ends_at?"":`endMaintenance(${m.id})`,"End")).join("")||"No maintenance"}
async function rename(id){const title=prompt("New title");if(title)await fetch(`/servers/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({title})}).then(r=>{if(!r.ok)throw Error()});load()}
async function resolve(id){await request(`/incidents/${id}/resolve`,{method:"POST"});load()} async function removeHook(id){await request(`/webhooks/${id}`,{method:"DELETE"});load()} async function removeServer(id){if(confirm("Delete this server and its history?")){await fetch(`/servers/${id}`,{method:"DELETE"});load()}}
async function resetUptime(id){await request(`/servers/${id}/reset-uptime`,{method:"POST"});load()} async function endMaintenance(id){await request(`/maintenance/${id}/end`,{method:"POST"});load()}
$("login-form").onsubmit=async e=>{e.preventDefault();try{await fetch("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:$("pin").value})}).then(r=>{if(!r.ok)throw Error()});$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");load()}catch{$("login-message").textContent="Invalid PIN"}}
$("logout").onclick=()=>fetch("/admin/logout",{method:"POST"}).then(()=>location.reload());
$("server-form").onsubmit=async e=>{e.preventDefault();await fetch("/servers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("server-title").value})});e.target.reset();load()}
$("maintenance-form").onsubmit=async e=>{e.preventDefault();await request("/maintenance",{method:"POST",body:JSON.stringify({serverId:$("maintenance-server").value,title:$("maintenance-title").value,startsAt:Date.now()})});e.target.reset();load()}
$("incident-form").onsubmit=async e=>{e.preventDefault();await request("/incidents",{method:"POST",body:JSON.stringify({serverId:$("incident-server").value,title:$("incident-title").value,description:$("incident-description").value})});e.target.reset();load()}
$("webhook-form").onsubmit=async e=>{e.preventDefault();await request("/webhooks",{method:"POST",body:JSON.stringify({serverId:$("webhook-server").value||null,name:$("webhook-name").value,url:$("webhook-url").value})});e.target.reset();load()}
</script></body></html>
